<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-10px) translateX(6px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(8px) translateX(-5px); }
      }
      @keyframes dataStream {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5; opacity: 0.7; }
        50% { r: 8; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      .glow-orb-1 {
        transform-origin: 200px 150px;
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .glow-orb-2 {
        transform-origin: 1000px 280px;
        animation: pulseGlow 10s ease-in-out infinite 2s;
      }
      .floating-pill-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-pill-2 { animation: floatReverse 7s ease-in-out infinite 1s; }
      .floating-pill-3 { animation: floatSlow 8s ease-in-out infinite 2s; }
      .floating-pill-4 { animation: floatReverse 6.5s ease-in-out infinite 0.5s; }
      .stream-line {
        stroke-dasharray: 10, 15;
        animation: dataStream 6s linear infinite;
      }
      .pulse-node { animation: nodePulse 3s ease-in-out infinite; }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.4px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="glow-orb-1" cx="200" cy="120" r="180" fill="#38bdf8" opacity="0.15" filter="url(#softGlow)"/>
  <circle class="glow-orb-2" cx="1020" cy="300" r="220" fill="#818cf8" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="600" cy="380" r="140" fill="#c084fc" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Dynamic Grid Interconnection Mesh Lines -->
  <g opacity="0.35">
    <line x1="80" y1="90" x2="280" y2="40" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="280" y1="40" x2="480" y2="85" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="900" y1="60" x2="1100" y2="110" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1000" y1="180" x2="1140" y2="310" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- Animated Streaming Data Path -->
    <path class="stream-line" d="M 60 340 Q 250 390 480 340 T 920 350 T 1140 280" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="stream-line" d="M 120 70 Q 400 20 650 60 T 1100 70" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Glowing Nodes on Mesh -->
  <circle class="pulse-node" cx="280" cy="40" r="5" fill="#38bdf8"/>
  <circle class="pulse-node" cx="900" cy="60" r="6" fill="#818cf8"/>
  <circle class="pulse-node" cx="1100" cy="110" r="5" fill="#c084fc"/>
  <circle class="pulse-node" cx="480" cy="340" r="6" fill="#38bdf8"/>

  <!-- FOREGROUND: Category Header Tag -->
  <g transform="translate(600, 75)">
    <rect x="-145" y="-17" width="290" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
    <circle cx="-120" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text text-anchor="middle" y="5" fill="#38bdf8" class="badge-text" font-size="12">CLOUD TESTING GRID ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND: Main Title & Gradient Highlight (Preserved on top) -->
  <text class="title-text" text-anchor="middle" x="600" y="150" fill="#ffffff" filter="url(#glow)">Awesome Cloud Testing Grid</text>
  <text class="title-text" text-anchor="middle" x="600" y="202" fill="url(#primaryGrad)">Infrastructure &amp; Device Farms</text>

  <!-- FOREGROUND: Subtitle -->
  <text class="subtitle-text" text-anchor="middle" x="600" y="250">
    Curated SaaS Platforms, Browser Grids, Mobile Farms &amp; Kubernetes Orchestrators
  </text>

  <!-- Dynamic Animated Feature Pills positioned tastefully in lower foreground -->
  <!-- Pill 1: Real Device Farms -->
  <g class="floating-pill-1" transform="translate(140, 310)">
    <rect width="195" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="21" r="7" fill="#38bdf8" opacity="0.8"/>
    <text x="42" y="26" fill="#e2e8f0" class="badge-text">📱 Real Device Farms</text>
  </g>

  <!-- Pill 2: Browser Grids -->
  <g class="floating-pill-2" transform="translate(365, 310)">
    <rect width="180" height="42" rx="21" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="21" r="7" fill="#818cf8" opacity="0.8"/>
    <text x="42" y="26" fill="#e2e8f0" class="badge-text">🌐 Browser Grids</text>
  </g>

  <!-- Pill 3: K8s Autoscaling -->
  <g class="floating-pill-3" transform="translate(575, 310)">
    <rect width="195" height="42" rx="21" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="21" r="7" fill="#a855f7" opacity="0.8"/>
    <text x="42" y="26" fill="#e2e8f0" class="badge-text">⚡ K8s Auto-scaling</text>
  </g>

  <!-- Pill 4: Open Source & SaaS -->
  <g class="floating-pill-4" transform="translate(800, 310)">
    <rect width="250" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="21" r="7" fill="#06b6d4" opacity="0.8"/>
    <text x="42" y="26" fill="#e2e8f0" class="badge-text">🚀 SaaS &amp; Open-Source Grids</text>
  </g>

  <!-- Border accent -->
  <rect x="0" y="0" width="1200" height="420" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)"/>
</svg>
